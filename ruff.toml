# SPDX-License-Identifier: Apache-2.0
line-length = 100
target-version = "py312"
exclude = [
    "docs",
    ".venv",
    "target",
    "node_modules",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]
