[project]
name = "praelector"
version = "0.3.0"
description = "Praelector engine core — local-first audiobook synthesis sidecar"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Praelector Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "platformdirs>=4.3.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "sqlalchemy>=2.0.35",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "keyring>=24.3.0",
    "cryptography>=43.0.0",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.1.0",
    "pysbd>=0.3.4",
]

[project.scripts]
praelector-engine = "praelector.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praelector"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "docs",
    ".venv",
    "target",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["engine/tests", "tests"]
norecursedirs = ["engine-tts", "apps", "node_modules", ".venv"]
markers = [
    "gpu: marks tests requiring physical GPU hardware (deselect with '-m \"not gpu\"')",
]
