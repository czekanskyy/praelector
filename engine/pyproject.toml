# SPDX-License-Identifier: Apache-2.0
[project]
name = "praelector-engine"
version = "0.2.0"
description = "Praelector engine sidecar: torch-free product logic, SQLite store, and the loopback HTTP/WS API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "The Praelector Authors" }]
keywords = ["audiobook", "epub", "tts", "lector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Private :: Do Not Upload",
]

# This environment must never resolve `torch`: the core is frozen into the
# installer and CI asserts the lock is torch-free (scripts/assert_no_torch.py).
# Anything that needs torch belongs in engine-tts (PLAN.md D-03, D-04).
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "platformdirs>=4.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "keyring>=25",
  "pypdf>=5.1",
  "pysbd>=0.3.4",
]

[project.scripts]
praelector-engine = "praelector.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]
package = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praelector"]

[tool.hatch.build.targets.wheel.force-include]
"src/praelector/text/data/speech_verbs_pl.txt" = "praelector/text/data/speech_verbs_pl.txt"
"src/praelector/text/data/given_names_pl.tsv" = "praelector/text/data/given_names_pl.tsv"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/praelector/store/migrations/versions"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib: every path is a pathlib.Path (PLAN.md §1.7)
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["praelector"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pysbd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: needs a real GPU; never runs in CI, only on the two reference machines",
  "ffmpeg: needs a real ffmpeg binary resolvable on PATH",
  "full_book: the long full-book pipeline run used by nightly-fixture.yml",
]

[tool.coverage.run]
source = ["src/praelector"]

[tool.coverage.report]
precision = 1
skip_covered = true
