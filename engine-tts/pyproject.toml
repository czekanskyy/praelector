# SPDX-License-Identifier: Apache-2.0
[project]
name = "praelector-tts"
version = "0.1.0"
description = "Praelector TTS worker: model loading and synthesis behind a JSONL stdio protocol."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "The Praelector Authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]

# Base dependencies must stay importable with no extra installed: importing
# praelector_tts has to succeed and expose the `fake` backend so CI can exercise
# the whole job engine without torch (PLAN.md §1.2, REPO_LAYOUT.md §6).
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
# One torch version per extra, never a union: there is no fat wheel and no
# attempt to make one environment serve both vendors (PLAN.md D-03).
cpu = ["torch==2.13.0"]
cuda = ["torch==2.13.0"]
# Linux-only: PyTorch publishes no ROCm wheels for Windows, and AMD's own
# Windows wheels are experimental (PLAN.md D-20). The provisioner refuses this
# flavour on Windows and offers `cpu` instead.
rocm = [
  "torch==2.12.0; sys_platform == 'linux'",
  # AMD's torch wheels require the `rocm` meta-package, whose own dependencies
  # (`rocm-sdk-libraries`, `rocm-sdk-core`, `triton`) are published on PyPI too,
  # at versions that do not satisfy AMD's pins. uv considers only the first index
  # that has a package — deliberately, to prevent dependency confusion — and a
  # `tool.uv.sources` entry is only honoured for a *direct* dependency, so the
  # whole chain has to be declared here and pinned to the AMD index.
  "rocm[libraries]; sys_platform == 'linux'",
  "rocm-sdk-libraries; sys_platform == 'linux'",
  "rocm-sdk-core; sys_platform == 'linux'",
  # AMD builds its own triton with a local version tag (3.8.0+git….rocm7.14.1).
  "triton; sys_platform == 'linux'",
]

[project.scripts]
praelector-tts-worker = "praelector_tts.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]
# macOS is CI-only and gets no torch (D-23); resolving for it just wastes time.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "amd-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
rocm = [{ index = "amd-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]
triton = [{ index = "amd-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]
rocm-sdk-core = [{ index = "amd-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]
rocm-sdk-libraries = [
  { index = "amd-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

# PyPI is declared first so it wins for every package it has. The AMD index is
# `explicit` — reachable only through the pins above — because it also publishes
# `numpy`, `sympy`, `triton` and friends, and uv's first-index-wins rule would
# otherwise let a ROCm-flavoured build of an ordinary library leak into the cpu
# and cuda environments.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "amd-rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praelector_tts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["praelector_tts"]
warn_unreachable = true

# torch is an optional extra: type-checking runs against the base environment,
# where it is not installed. The lazy imports are guarded by torch_available().
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: needs a real GPU and an installed torch extra; never runs in CI",
  "torch: needs any torch extra installed; skipped when torch is absent",
]

[tool.coverage.run]
source = ["src/praelector_tts"]
