version: 2
updates:
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /engine-tts
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
