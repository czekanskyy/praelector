name: pr-title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            engine
            engine-tts
            ui
            desktop
            ebook
            text
            llm
            tts
            gpu
            jobs
            mux
            store
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
