name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # main is squash-merge only, so the PR title becomes the commit message release-please reads (NF-09)
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # v5 reads these with getMultilineInput and does not split on commas,
          # so a single comma-separated line is one illegal type and every title fails.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            engine
            engine-tts
            ui
            desktop
            ebook
            text
            llm
            tts
            gpu
            jobs
            mux
            store
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
