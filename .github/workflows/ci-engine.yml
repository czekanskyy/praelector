name: engine

on:
  pull_request:
    paths:
      - "engine/**"
      - "engine-tts/**"
      - "scripts/**"
      - ".github/workflows/ci-engine.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync engine core environment
        run: uv sync --project engine --group dev --frozen

      - name: Sync engine-tts worker environment (CPU extra)
        run: uv sync --project engine-tts --extra cpu --group dev --frozen

      - name: Lint with ruff
        run: uv run --project engine ruff check .

      - name: Check formatting with ruff
        run: uv run --project engine ruff format --check .

      - name: Type check with mypy
        run: uv run --project engine mypy --strict engine/src

      - name: Assert no torch in core lockfile
        run: uv run python scripts/assert_no_torch.py engine/uv.lock

      - name: Setup ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run unit & integration tests
        run: uv run --project engine pytest -m "not gpu" --cov=praelector --cov-report=xml

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: engine-test-output-${{ matrix.os }}
          path: engine/.pytest_cache
