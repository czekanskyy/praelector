name: desktop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is pinned deliberately: it fixes the glibc floor at 2.35 for the
          # AppImage, which is what makes the artifact usable on CachyOS and older distros.
          - { os: ubuntu-22.04, required: true }
          - { os: windows-latest, required: true }
          - { os: macos-14, required: false }      # D-23: best effort, produces no artifact
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds the frontend assets (and on Windows the icon resource)
      # during codegen, so the dist dir must exist before cargo runs.
      - run: pnpm -F ui build
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - run: pnpm tauri build --no-bundle       # compile + link only; bundling happens in release.yml
