name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - ".github/workflows/ci-desktop.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, required: true }
          - { os: windows-latest, required: true }
          - { os: macos-14, required: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop -> target"

      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml -- -D warnings

      - name: Tauri build (compile only, no bundle)
        run: pnpm tauri build --no-bundle
