name: nightly-fixture

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync environments
        run: |
          uv sync --project engine --group dev --frozen
          uv sync --project engine-tts --extra cpu --group dev --frozen

      - name: Setup ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pipeline integration test with fake backend
        id: pipeline
        run: uv run --project engine pytest engine/tests/integration/test_full_pipeline_fake.py -v

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly fixture run failed (${new Date().toISOString().split('T')[0]})`,
              body: `The automated nightly headless fixture pipeline run failed.\n\nSee run details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'area:ci']
            });
