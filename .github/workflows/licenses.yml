name: licenses

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # engine/ arrives in PR 2. license_check.py already treats a missing project
      # directory as a warning (it says so in --help); uv sync does not.
      - name: sync engine when it is in the tree
        shell: bash
        run: |
          if [ -f engine/pyproject.toml ]; then
            uv sync --project engine --frozen
          else
            echo "engine is not in this revision yet"
          fi

      # NF-03: the deny list (GPL/AGPL/SSPL/BUSL/CC-*-NC) is what keeps EbookLib
      # out — D-01. Scoped to what the installer actually ships: the torch-free
      # engine core and the UI. `uv export --no-dev` is the component set.
      - name: shipped components satisfy the policy
        run: uv run --no-project --python 3.12 python scripts/license_check.py --python engine --node apps/ui

      - run: uv run --no-project --python 3.12 python scripts/spdx_headers.py --check

      # NOTICE on main already lists the engine's dependencies, which are committed
      # with the engine tree in the next PR. Regenerating before that tree exists
      # wipes the file down to "no components" and the diff can never be empty.
      - name: NOTICE is current
        shell: bash
        run: |
          if [ ! -f engine/pyproject.toml ]; then
            echo "engine is not in this revision yet; NOTICE is checked once it lands"
            exit 0
          fi
          uv run --no-project --python 3.12 python scripts/license_check.py --python engine --node apps/ui --write-notice
          git diff --exit-code NOTICE

      # The provisioned TTS runtime (torch + a backend, 2.5-4 GB) is NOT in the
      # installer: it is created on the user's machine, and its component and
      # model-weight licenses are shown in-app before any download (TTS-02, D-04).
      # `uv.lock` carries no license metadata and the nvidia-*/rocm-* wheels are
      # linux-marker'd, so their licenses cannot be resolved on a runner. This step
      # therefore still runs the deny list over what IS resolvable, but does not
      # block. Closing it properly — a reviewed license table for the runtime plus
      # docs/licenses.md — is M3 work (PLAN.md §9 M6).
      - name: provisioned TTS runtime (informational)
        continue-on-error: true
        run: |
          if [ ! -f engine-tts/pyproject.toml ]; then
            echo "engine-tts is not in this revision yet"
            exit 0
          fi
          uv sync --project engine-tts --extra cpu --frozen
          uv run --no-project --python 3.12 python scripts/license_check.py --python engine-tts
