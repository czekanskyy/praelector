name: Feature Request
description: Suggest an idea or feature for Praelector
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please review the PRD and open issues before submitting to check if your suggestion is already planned or explicitly out of scope (e.g. OCR, DRM circumvention, multi-book queues).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
